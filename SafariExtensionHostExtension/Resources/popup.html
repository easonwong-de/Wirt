<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Safari Extension Host</title>
		<link
			rel="stylesheet"
			href="popup.css"
		/>
	</head>
	<body>
		<div id="container">
			<div id="list-view">
				<header
					id="app-header"
					class="app-header"
					hidden
				>
					<div class="header-title-row">
						<span class="header-title">Installed Extensions</span>
						<button
							id="btn-refresh"
							class="icon-refresh"
							title="Refresh"
						>
							<svg
								width="12"
								height="12"
								viewBox="0 0 16 16"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<path d="M2.5 8a5.5 5.5 0 1 0 1.2-3.4" />
								<polyline points="2.5 2.5 2.5 5.5 5.5 5.5" />
							</svg>
						</button>
					</div>
				</header>
				<hr
					id="popup-divider"
					class="popup-divider"
					hidden
				/>

				<div
					id="disconnected-view"
					class="center-container"
					hidden
				>
					<div class="center-icon">
						<svg
							width="40"
							height="40"
							viewBox="0 0 40 40"
							fill="none"
							stroke="currentColor"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<rect
								x="4"
								y="4"
								width="32"
								height="32"
								rx="8"
								stroke-width="2.2"
							/>
							<line
								x1="4"
								y1="13"
								x2="36"
								y2="13"
								stroke-width="1.8"
							/>
							<circle
								cx="10"
								cy="8.5"
								r="1.5"
								fill="currentColor"
								stroke="none"
							/>
							<circle
								cx="15"
								cy="8.5"
								r="1.5"
								fill="currentColor"
								stroke="none"
							/>
							<circle
								cx="20"
								cy="8.5"
								r="1.5"
								fill="currentColor"
								stroke="none"
							/>
							<path
								d="M17 21h2a1.5 1.5 0 0 1 3 0h2v2a1.5 1.5 0 0 1 0 3v2h-2a1.5 1.5 0 0 1-3 0h-2v-2a1.5 1.5 0 0 1 0-3z"
								stroke-width="1.8"
							/>
						</svg>
					</div>
					<div class="header-title-row">
						<span class="status-indicator"></span>
						<span class="header-title">Host App Not Connected</span>
						<button
							id="btn-refresh-disconnected"
							class="icon-refresh"
							title="Refresh"
						>
							<svg
								width="12"
								height="12"
								viewBox="0 0 16 16"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<path d="M2.5 8a5.5 5.5 0 1 0 1.2-3.4" />
								<polyline points="2.5 2.5 2.5 5.5 5.5 5.5" />
							</svg>
						</button>
					</div>
					<span class="center-subtitle"
						>Open Safari Extension Host to connect.</span
					>
				</div>

				<div
					id="empty-view"
					class="center-container"
					hidden
				>
					<div class="center-icon">
						<svg
							width="40"
							height="40"
							viewBox="0 0 40 40"
							fill="none"
							stroke="currentColor"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path
								d="M14 27h-4a2 2 0 0 1-2-2v-4a3 3 0 0 1 0-6v-4a2 2 0 0 1 2-2h4a3 3 0 0 0 6 0h4a2 2 0 0 1 2 2v4a3 3 0 0 0 0 6v4a2 2 0 0 1-2 2h-4a3 3 0 0 1-6 0z"
								stroke-width="2.2"
							/>
						</svg>
					</div>
					<div class="center-text-group">
						<span class="center-title"
							>No Extensions Installed</span
						>
						<span class="center-subtitle"
							>Download a .crx or .xpi package in Safari to
							install.</span
						>
					</div>
				</div>

				<div
					id="extension-list"
					class="extension-list"
				></div>
			</div>

			<div
				id="popup-view"
				hidden
			>
				<header class="popup-header">
					<button
						id="btn-back"
						class="nav-button"
					>
						&larr; Back
					</button>
					<span
						id="popup-title"
						class="popup-title"
						>Extension Popup</span
					>
					<button
						id="btn-close-view"
						class="icon-button"
					>
						&times;
					</button>
				</header>
				<div class="frame-container">
					<iframe
						id="popup-frame"
						src="about:blank"
						sandbox="allow-scripts allow-forms allow-same-origin"
					></iframe>
				</div>
			</div>
		</div>
		<script src="popup.js"></script>
	</body>
</html>
